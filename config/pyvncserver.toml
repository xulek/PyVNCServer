# Safe packaged defaults for PyVNCServer.

[server]
host = "127.0.0.1"
port = 5900
frame_rate = 30
lan_frame_rate = 90
network_profile_override = "auto"
scale_factor = 1.0
capture_backend = "auto"
monitor_index = 0
capture_all_monitors = false
capture_probe_frames = 0
capture_probe_warn_ms = 40.0
max_connections = 10
max_connections_per_ip = 4
max_unauthenticated_connections = 4
handshake_timeout = 5.0
client_socket_timeout = 60.0
input_control_policy = "single-controller"

[security]
password = ""
read_only_password = ""
allow_insecure_no_auth = false
# Legacy direct TLS wrapper. Prefer VeNCrypt for standards-based RFB TLS negotiation.
tls_enabled = false
tls_cert_file = ""
tls_key_file = ""
tls_minimum_version = "1.2"

# VeNCrypt 0.2 (RFB security type 19). Empty subtypes = automatic:
# X509Vnc when a VNC password is configured, otherwise X509None.
vencrypt_enabled = false
vencrypt_subtypes = []
vencrypt_allow_anonymous_tls = false
vencrypt_allow_no_auth_with_password = false
require_encrypted_transport = false

auth_max_failures = 5
auth_failure_window_seconds = 30.0
auth_backoff_max_seconds = 2.0

[features]
enable_region_detection = true
enable_metrics = true
enable_health_checks = true
enable_request_coalescing = true
enable_lan_adaptive_encoding = true
enable_websocket = false
enable_tight_extensions = true
enable_cursor_encoding = false
enable_copyrect_encoding = true
enable_zrle_encoding = true
enable_tight_encoding = true
enable_jpeg_encoding = true
enable_h264_encoding = false
enable_parallel_encoding = true
enable_capture_producer = true
enable_dxgi_metadata = true
enable_continuous_updates = true
enable_fence = true
enable_last_rect = false
enable_extended_desktop_size = true
allow_client_resize = false
tight_stream_reset_for_ultravnc = false

[lan]
raw_area_threshold = 0.10
raw_max_pixels = 65536
prefer_zlib = true
zlib_area_threshold = 0.08
zlib_min_pixels = 8192
zlib_compression_level = 2
zlib_disable_if_request_gap_ms = 1500
jpeg_area_threshold = 0.20
jpeg_min_pixels = 16384
jpeg_quality_initial = 84
jpeg_quality_min = 70
jpeg_quality_max = 95
zrle_compression_level = 3

[adaptive]
enabled = true
min_fps = 12
target_utilization = 0.80
decrease_factor = 0.80
increase_step_fps = 2.0
overload_ratio = 1.10
recovery_ratio = 0.72
overload_samples = 2
recovery_samples = 8
ewma_alpha = 0.20
merge_regions = true
merge_gap_px = 12
merge_max_expansion = 1.35
merge_force_count = 12
cache_enabled = true
cache_max_entries = 512
cache_max_bytes = 33554432
cache_max_item_bytes = 1048576
cache_ttl_seconds = 2.0
reorder_encodings = true
adapt_tight_compression = true

[performance]
# v4.1 default: prioritize current frames and low queueing latency.
profile = "low-latency"
capture_producer_fps = 120
socket_send_buffer_bytes = 262144
socket_receive_buffer_bytes = 131072
framebuffer_send_coalesce_bytes = 131072
producer_conversion_cache_entries = 4
producer_conversion_cache_max_bytes = 67108864
drop_stale_continuous_frames = true

[websocket]
allowed_origins = []
detect_timeout = 0.5
max_handshake_bytes = 65536
max_payload_bytes = 8388608
max_buffer_bytes = 16777216
max_message_bytes = 16777216

[limits]
max_set_encodings = 1024
max_client_cut_text = 16777216
encoding_threads = 0
tight_disable_for_ultravnc = false

[logging]
log_level = "INFO"
log_file = ""

[clipboard]
enabled = true
direction = "both"
max_bytes = 1048576
encoding = "latin-1"

[observability]
prometheus_enabled = false
prometheus_host = "127.0.0.1"
prometheus_port = 9100
