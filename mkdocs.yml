site_name: PyVNCServer
site_description: Modern, high-performance VNC / RFB 3.8 server written in Python
site_url: https://xulek.github.io/PyVNCServer/
repo_url: https://github.com/xulek/PyVNCServer
repo_name: xulek/PyVNCServer
edit_uri: edit/main/docs/
copyright: Copyright &copy; PyVNCServer contributors

nav:
  - Home: index.md
  - Getting started:
      - Installation & quick start: getting-started.md
      - Configuration: configuration.md
  - Client guides:
      - UltraVNC: ultravnc.md
      - noVNC & WebSocket: novnc.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Encodings: encodings.md
      - Security: security.md
      - CLI & Python API: api.md
      - Architecture: architecture.md
      - Performance: performance.md
  - Development: development.md

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xulek/PyVNCServer
      name: PyVNCServer on GitHub
